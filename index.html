<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Tipo Agar.io</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            color: white;
        }
        #gameCanvas {
            display: block;
        }
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.9);
            padding: 25px 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            z-index: 10;
        }
        #menu h1 {
            margin-top: 0;
            font-size: 28px;
            color: #00ccff;
        }
        #menu input, #menu select, #menu button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        #menu input, #menu select {
            background: #222;
            color: white;
            border: 1px solid #444;
        }
        #menu button {
            background: #00ccff;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #menu button:hover {
            background: #0099cc;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Agar.io Clone</h1>
        <label align="left">Nombre del jugador:</label>
        <input type="text" id="username" value="Jugador" maxlength="15">
        
        <label align="left">Modo de juego:</label>
        <select id="gameMode">
            <option value="online">Multijugador en Línea</option>
            <option value="bots">Modo Solo (con Bots)</option>
        </select>

        <button id="startBtn">¡JUGAR!</button>
    </div>

    <div id="ui">
        <div><strong>Jugadores en línea:</strong> <span id="playerCount">0</span></div>
        <div>Masa / Tamaño: <span id="playerSize">0</span></div>
        <div><strong>W</strong>: Arriba | <strong>S</strong>: Abajo | <strong>A</strong>: Izquierda | <strong>D</strong>: Derecha</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const MAP_WIDTH = 3000;
        const MAP_HEIGHT = 3000;

        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener("keydown", (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = true;
        });

        window.addEventListener("keyup", (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = false;
        });

        let ws = null;
        let players = {};
        let foods = [];
        let myId = null;

        document.getElementById("startBtn").addEventListener("click", () => {
            const name = document.getElementById("username").value || "Jugador";
            const mode = document.getElementById("gameMode").value;

            document.getElementById("menu").style.display = "none";
            document.getElementById("ui").style.display = "block";

            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${protocol}//${location.host}/ws`);

            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: "join",
                    name: name,
                    mode: mode
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "init") {
                    myId = data.id;
                } else if (data.type === "state") {
                    players = data.players || {};
                    foods = data.foods || [];
                    document.getElementById("playerCount").innerText = Object.keys(players).length;
                    if (myId && players[myId]) {
                        document.getElementById("playerSize").innerText = Math.round(players[myId].radius);
                    }
                }
            };

            setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "input", keys: keys }));
                }
            }, 1000 / 60);
        });

        function drawGrid(me) {
            ctx.strokeStyle = "#222";
            ctx.lineWidth = 1;
            const gridSize = 50;

            const startX = Math.floor((me.x - canvas.width / 2) / gridSize) * gridSize;
            const endX = startX + canvas.width + gridSize * 2;
            const startY = Math.floor((me.y - canvas.height / 2) / gridSize) * gridSize;
            const endY = startY + canvas.height + gridSize * 2;

            for (let x = startX; x < endX; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, startY);
                ctx.lineTo(x, endY);
                ctx.stroke();
            }
            for (let y = startY; y < endY; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(startX, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const me = players[myId];

            if (me) {
                ctx.save();
                ctx.translate(canvas.width / 2 - me.x, canvas.height / 2 - me.y);

                drawGrid(me);

                // Bordes del mapa
                ctx.strokeStyle = "#ff4444";
                ctx.lineWidth = 8;
                ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

                // Dibujar comida
                foods.forEach(food => {
                    ctx.beginPath();
                    ctx.arc(food.x, food.y, food.radius || 5, 0, Math.PI * 2);
                    ctx.fillStyle = food.color || "#00ff00";
                    ctx.fill();
                    ctx.closePath();
                });

                // Dibujar jugadores / bots
                Object.values(players).forEach(player => {
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                    ctx.fillStyle = player.color || "#00ccff";
                    ctx.fill();
                    ctx.closePath();

                    if (player.id === myId) {
                        ctx.strokeStyle = "#ffffff";
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 14px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(player.name, player.x, player.y - player.radius - 8);
                });

                ctx.restore();
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
